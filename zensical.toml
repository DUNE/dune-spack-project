[project]
site_name = "DUNE Spack Project"
site_description = "Documentation, training, and issue tracking for DUNE Spack and MPD development and use"
site_url = "https://dune.github.io/dune-spack-project/"

nav = [
  { "Home" = "index.md" },
  { "Repositories" = "repositories.md" },
  { "Configuration reference" = "configuration-reference.md" },
  { "Contributing" = "contributing.md" },
]

extra_css = ["stylesheets/extra.css"]

[project.theme]
logo = "images/dune-logo.jpeg"
favicon = "images/favicon.png"
features = [
  "navigation.sections",
  "navigation.top",
  "navigation.footer",
  "navigation.indexes",
  "search.suggest",
  "search.highlight",
  "content.code.copy",
  "toc.follow",
]

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.markdown_extensions]
tables = {}
footnotes = {}
attr_list = {}
md_in_html = {}
admonition = {}
toc = {
  permalink = true
}
pymdownx.details = {}
pymdownx.superfences = {}
pymdownx.highlight = {
  anchor_linenums = true
}
pymdownx.tasklist = {
  custom_checkbox = true
}
